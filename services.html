<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الخدمات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="services">

<div class="top">
  <div class="bar">
    <a class="brand" data-page="index.html" href="index.html" data-i="brand"></a>
    <button class="lang" id="lang" type="button"></button>
    <nav>
      <a data-page="index.html" href="index.html" data-i="navHome"></a>
      <a data-page="services.html" href="services.html" aria-current="page" data-i="navServices"></a>
    </nav>
  </div>
</div>

<header class="banner lattice">
  <div class="wrap">
    <h1 class="page-title" data-i="servicesH"></h1>
    <p class="lead" data-i="servicesIntro"></p>
  </div>
</header>

<main>
  <section>
    <div id="services-list"></div>
    <p class="note" data-i="priceNote"></p>
  </section>
</main>

<section class="cta lattice">
  <div class="wrap">
    <h2 data-i="ctaH"></h2>
    <p data-i="ctaP"></p>
    <div class="actions">
      <a class="btn btn-wa" data-wa href="#">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>
        <span data-i="waBtn"></span>
      </a>
    </div>
  </div>
</section>

<footer>
  <span data-i="footerNum"></span> <span class="num" data-num></span>
</footer>

<script src="site.js"></script>
</body>
</html>
